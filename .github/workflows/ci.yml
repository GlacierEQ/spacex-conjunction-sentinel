name: Native functional verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed in canonical run 31638096050
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 observed in canonical run 31638096050
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src tests
      - run: pytest -q
      - run: conjunction-sentinel demo > /tmp/conjunction-demo.json
      - run: python -c 'import json; d=json.load(open("/tmp/conjunction-demo.json")); assert d["schema"] == "glaciereq.conjunction-assessment.v1"; assert d["operational_authority"] is False'

  rust:
    name: Rust native verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed in canonical run 31638096050
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action observed in canonical run 31638096050
        with:
          toolchain: stable
      - run: cargo check --all-targets
      - run: cargo test

  required-quality-gate:
    if: always()
    needs: [python, rust]
    runs-on: ubuntu-latest
    steps:
      - name: Require every native boundary
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$PYTHON_RESULT" = "success"
          test "$RUST_RESULT" = "success"

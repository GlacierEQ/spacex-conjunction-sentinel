[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "glaciereq-conjunction-sentinel"
version = "1.0.0"
description = "Deterministic local conjunction-assessment and maneuver-review simulation toolkit"
requires-python = ">=3.11"
license = { text = "LicenseRef-GlacierEQ-Proprietary-1.1" }
authors = [{ name = "GlacierEQ" }]

[project.scripts]
conjunction-sentinel = "conjunction:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["conjunction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
